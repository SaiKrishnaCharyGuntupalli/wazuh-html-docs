site_name: Wazuh MSSP Multi-Tenant Implementation Guide
site_description: Production implementation guide for multi-tenant Wazuh MSSP on single-node Docker

theme:
  name: material
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/security
    repo: fontawesome/brands/git-alt
  font:
    text: Inter
    code: JetBrains Mono
extra_css:
  - stylesheets/extra.css
  - stylesheets/responsive-nav.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Getting Started: 01-Getting_started/Getting_started.md
  - Deployment & Configuration:
      - Index Template & Filebeat: 02-index-template-filebeat/index_template.md
      - Agent Deployment: 03-agent-deployment/agent_deplyment.md
      - Agent Configuration: 04-agent-configuration/agent_config.md
  - Security & Access:
      - RBAC: 06-rbac/rbac.md
      - Document Level Security (DLS): 07-dls/dls.md
      - SSO - Microsoft Entra ID: 08-sso-entra/sso.md
  - Reference:
      - Cluster and Index Verification: 09-Cluster and Index Verification/Cluster and Index Verification.md
      - Reference: 10-reference/reference.md
  - "POC's":
      - "GitHub_Webhook_to_Logstash": "POC's/Junaid/GitHub_Webhook_to_Logstash/GitHub_Webhook_to_Logstash_POC.md"
