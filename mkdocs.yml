site_name: Wazuh MSSP Multi-Tenant Implementation Guide
site_description: Production implementation guide for multi-tenant Wazuh MSSP on single-node Docker
dev_addr: localhost:8001

theme:
  name: material
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/security
    repo: fontawesome/brands/git-alt
  font:
    text: Inter
    code: JetBrains Mono
extra_css:
  - stylesheets/extra.css
  - stylesheets/responsive-nav.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Home: index.md

  - 1. Architecture & Deployment:
      - Getting Started: 01-Getting_started/Getting_started.md
      - Index Templates & Filebeat: 02-index-template-filebeat/index_template.md
      - Wazuh Multi-Node Runbook: POC's/Vineeth/Wazuh Multi Node Runbook/Wazuh Multi Node Runbook.md

  - 2. Secure Ingestion & Pipelines:
      - High Availability Log Ingestion: POC's/Vineeth/High Availability Log Ingestion Pipeline Deployment Guide/High Availability Log Ingestion Pipeline Deployment Guide.md

  - 3. Endpoint & Group Management:
      - Agent Deployment: 03-agent-deployment/agent_deplyment.md
      - Agent Configuration: 04-agent-configuration/agent_config.md
      - Zero Downtime Group Configuration: POC's/Junaid/POC_Zero_Downtime_Group_Configuration_Deployment_in_Wazuh_HA/POC_Zero_Downtime_Group_Configuration_Deployment_in_Wazuh_HA.md
      - Multi-Group Agent Assignment: POC's/Junaid/POC- Single Agent Multi-Group in Wazuh/POC- Single Agent Multi-Group in Wazuh.md
      - OS-Based Dynamic Grouping: POC's/Junaid/POC-01_Operating_System_Based_Group_Creation_in_Wazuh_GitHub/POC-01_Operating_System_Based_Group_Creation_in_Wazuh_GitHub.md

  - 4. Access Control & Identity:
      - Role-Based Access Control (RBAC): 06-rbac/rbac.md
      - Document Level Security (DLS): 07-dls/dls.md
      - SSO Integration (Microsoft Entra ID): 08-sso-entra/sso.md

  - 5. Operations & Verification:
      - Cluster & Index Verification: 09-Cluster and Index Verification/Cluster and Index Verification.md
      - Wazuh Reference Guide: 10-reference/reference.md

  - 6. Non Wazuh SOC Onboarding & Implementation:
      - Non Wazuh SOC Onboarding & Implementation Guide: POC's/Junaid/Non_Wazuh_SOC_Onboarding_and_Implementation_Guide/Non_Wazuh_SOC_Onboarding_and_Implementation_Guide.md

